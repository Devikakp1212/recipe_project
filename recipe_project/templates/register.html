{% extends 'base.html' %}

{% block content %}

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        background: linear-gradient(135deg, #ece579, #9ff35a);
    }

    .register-container{
        width:100%;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .register-card{
        width:100%;
        max-width:460px;
        background:rgba(255,255,255,0.95);
        padding:45px;
        border-radius:25px;
        box-shadow:0 15px 35px rgba(0,0,0,0.15);
        backdrop-filter: blur(10px);
        animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(20px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    .register-card h2{
        text-align:center;
        margin-bottom:10px;
        font-size:34px;
        color:#2f4f2f;
    }

    .subtitle{
        text-align:center;
        color:gray;
        margin-bottom:30px;
        font-size:15px;
    }

    form p{
        margin-bottom:20px;
    }

    form label{
        display:block;
        margin-bottom:8px;
        font-weight:600;
        color:#444;
    }

    form input{
        width:100%;
        padding:14px;
        border:1px solid #dcdcdc;
        border-radius:12px;
        outline:none;
        font-size:15px;
        transition:0.3s;
        background:#fafafa;
    }

    form input:focus{
        border-color:#37d928;
        box-shadow:0 0 10px rgba(55,217,40,0.25);
        background:white;
    }

    .register-btn{
        width:100%;
        padding:14px;
        border:none;
        border-radius:12px;
        background:#94da52;
        color:white;
        font-size:17px;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
        margin-top:10px;
    }

    .register-btn:hover{
        background:goldenrod;
        transform:translateY(-2px);
    }

    .login-link{
        text-align:center;
        margin-top:25px;
        color:#666;
        font-size:15px;
    }

    .login-link a{
        text-decoration:none;
        color:#5b8c2a;
        font-weight:bold;
        transition:0.3s;
    }

    .login-link a:hover{
        color:goldenrod;
    }

</style>

<div class="register-container">

    <div class="register-card">

        <h2>Create Account</h2>

        <p class="subtitle">
            Register to continue your journey
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="register-btn">
                Register
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login/">Login</a>
        </div>

    </div>

</div>

{% endblock %}
