<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Website</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            background:#f8fdf2;
        }

        /* NAVBAR */

        .navbar{
            width:100%;
            background: linear-gradient(135deg, #ece579, #9ff35a);
            padding:18px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        .logo{
            font-size:30px;
            font-weight:bold;
            color:#2f4f2f;
        }

        .nav-links{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .nav-links a{
            text-decoration:none;
            color:#2f4f2f;
            font-weight:600;
            padding:10px 18px;
            border-radius:10px;
            transition:0.3s;
        }

        .nav-links a:hover{
            background:goldenrod;
            color:white;
        }

        .hero-section{
            text-align:center;
            padding:70px 20px;
        }

        .hero-section h1{
            font-size:50px;
            color:#2f4f2f;
            margin-bottom:15px;
        }

        .hero-section p{
            font-size:18px;
            color:#666;
        }

        .content{
            padding:30px 8%;
        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            RecipeHub
        </div>

        <div class="nav-links">

            {% if user.is_authenticated %}

                <a href="/profile/">Profile</a>
                <a href="/logout/">Logout</a>

            {% else %}

                <a href="/register/">Register</a>
                <a href="/login/">Login</a>

            {% endif %}

        </div>

    </div>

    <!-- HERO SECTION -->

    <div class="hero-section">

        <h1>Digital Recipe Sharing Website</h1>

        <p>
            Discover, Cook and Share Delicious Recipes
        </p>

    </div>

    <!-- PAGE CONTENT -->

    <div class="content">

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
