{% extends 'base.html' %}

{% block content %}

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        background: linear-gradient(135deg, #ece579, #9ff35a);
    }

    .login-container{
        width:100%;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .login-card{
        width:100%;
        max-width:430px;
        background:rgba(255,255,255,0.95);
        padding:45px;
        border-radius:25px;
        box-shadow:0 15px 35px rgba(0,0,0,0.15);
        backdrop-filter: blur(10px);
        animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(20px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    .login-card h2{
        text-align:center;
        font-size:34px;
        color:#2f4f2f;
        margin-bottom:10px;
    }

    .subtitle{
        text-align:center;
        color:gray;
        margin-bottom:30px;
        font-size:15px;
    }

    .input-group{
        margin-bottom:22px;
    }

    .input-group label{
        display:block;
        margin-bottom:8px;
        font-weight:600;
        color:#444;
    }

    .input-group input{
        width:100%;
        padding:14px;
        border:1px solid #dcdcdc;
        border-radius:12px;
        outline:none;
        font-size:15px;
        background:#fafafa;
        transition:0.3s;
    }

    .input-group input:focus{
        border-color:#37d928;
        box-shadow:0 0 10px rgba(55,217,40,0.25);
        background:white;
    }

    .login-btn{
        width:100%;
        padding:14px;
        border:none;
        border-radius:12px;
        background:#94da52;
        color:white;
        font-size:17px;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
    }

    .login-btn:hover{
        background:goldenrod;
        transform:translateY(-2px);
    }

    .register-link{
        text-align:center;
        margin-top:25px;
        color:#666;
        font-size:15px;
    }

    .register-link a{
        text-decoration:none;
        color:#5b8c2a;
        font-weight:bold;
        transition:0.3s;
    }

    .register-link a:hover{
        color:goldenrod;
    }

</style>

<div class="login-container">

    <div class="login-card">

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to continue
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password">
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="register-link">
            Don’t have an account?
            <a href="/register/">Register</a>
        </div>

    </div>

</div>

{% endblock %}
